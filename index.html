<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R3D - Ranbhumi 3D</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; color: #fff; text-shadow: 1px 1px 3px #000; }
        .stats-panel { background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); width: fit-content; }
        .level-info { font-size: 18px; font-weight: bold; color: #ffcc00; margin-bottom: 5px; }
        .status-bar { font-size: 14px; margin-top: 3px; }
        
        /* Controls */
        .controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
        .touch-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-weight: bold; font-size: 14px; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); active { background: rgba(255,255,255,0.5); } }
        .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .action-btns { display: flex; gap: 12px; }
        .fire-btn { background: rgba(220, 53, 69, 0.7); border-color: #ff4d4d; width: 75px; height: 75px; font-size: 16px; }
        .vehicle-btn { background: rgba(40, 167, 69, 0.7); border-color: #5cd65c; }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 3px; left: 3px; width: 2px; height: 2px; background: red; border-radius: 50%; }

        /* Level Clear Modal */
        #modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; pointer-events: auto; z-index: 100; }
        #modal h1 { color: #ffcc00; font-size: 32px; margin-bottom: 10px; text-transform: uppercase; }
        #modal p { font-size: 18px; margin-bottom: 20px; text-align: center; max-width: 80%; }
        #modal button { padding: 12px 30px; font-size: 18px; background: #ffcc00; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; color: #000; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="crosshair"></div>
        
        <div id="ui-layer">
            <div class="stats-panel">
                <div class="level-info" id="level-display">LEVEL 1: MALL ROAD SWEEP</div>
                <div class="status-bar" id="target-display">Target: Eliminate Enemies (0/5)</div>
                <div class="status-bar" id="health-display">HP: 100 | Ammo: 30/∞</div>
                <div class="status-bar" id="vehicle-display">Current Vehicle: On Foot</div>
            </div>

            <div class="controls">
                <div class="dpad">
                    <div></div><div class="touch-btn" id="btn-up">▲</div><div></div>
                    <div class="touch-btn" id="btn-left">◀</div><div></div><div class="touch-btn" id="btn-right">▶</div>
                    <div></div><div class="touch-btn" id="btn-down">▼</div><div></div>
                </div>
                <div class="action-btns">
                    <div class="touch-btn vehicle-btn" id="btn-vehicle">ENTER VEHICLE</div>
                    <div class="touch-btn fire-btn" id="btn-fire">FIRE</div>
                </div>
            </div>
        </div>

        <div id="modal">
            <h1 id="modal-title">R3D - RANBHUMI 3D</h1>
            <p id="modal-desc">Indian Battle Royale Mission.<br>Clear Mall Road & neutralize all hostile targets!</p>
            <button id="start-btn" onclick="startGame()">START MISSION</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let scene, camera, renderer;
        let player, playerGun;
        let enemies = [], vehicles = [];
        let currentLevel = 1;
        let kills = 0;
        let targetKills = 5;
        let inVehicle = false;
        let activeVehicle = null;
        let health = 100;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            createEnvironment();
            createPlayer();
            spawnVehicles();
            spawnEnemies();

            camera.position.set(0, 3, 5);
            
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Indian Mall Road Environment
        function createEnvironment() {
            // Ground / Road
            const roadGeo = new THREE.PlaneGeometry(60, 400);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Grass Sides
            const grassGeo = new THREE.PlaneGeometry(200, 400);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
            const grassLeft = new THREE.Mesh(grassGeo, grassMat);
            grassLeft.rotation.x = -Math.PI / 2;
            grassLeft.position.x = -130;
            scene.add(grassLeft);

            const grassRight = grassLeft.clone();
            grassRight.position.x = 130;
            scene.add(grassRight);

            // Indian Mall / Buildings along Road
            for (let i = -180; i < 180; i += 40) {
                createBuilding(-38, i, 0xffa500); // Orange Tint
                createBuilding(38, i, 0x138808);  // Green Tint
            }
        }

        function createBuilding(x, z, color) {
            const height = 15 + Math.random() * 15;
            const geo = new THREE.BoxGeometry(15, height, 25);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const building = new THREE.Mesh(geo, mat);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Player Body
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0000ff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            player.add(body);

            // 3D Gun
            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            playerGun = new THREE.Mesh(gunGeo, gunMat);
            playerGun.position.set(0.4, 1.2, -0.5);
            player.add(playerGun);

            player.position.set(0, 0, 150);
            scene.add(player);
        }

        // Spawn Indian Indian Vehicles (Tank, Bike, Fighter Plane, Helicopter)
        function spawnVehicles() {
            // Tank
            createVehicle(0, 0.8, 100, 0x556b2f, 'Army Tank', 'tank');
            // Indian Bike
            createVehicle(-8, 0.5, 80, 0xcc0000, 'Indian Bullet Bike', 'bike');
            // Helicopter
            createVehicle(10, 2, 40, 0x444444, 'Combat Helicopter', 'heli');
            // Fighter Plane
            createVehicle(-10, 2, -10, 0x888888, 'Rafale Fighter Jet', 'plane');
        }

        function createVehicle(x, y, z, color, name, type) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(2.5, 1.2, 4);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            group.add(mesh);
            
            group.position.set(x, y, z);
            group.userData = { name: name, type: type };
            scene.add(group);
            vehicles.push(group);
        }

        function spawnEnemies() {
            for (let i = 0; i < targetKills; i++) {
                const geo = new THREE.CylinderGeometry(0.5, 0.5, 2);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                const enemy = new THREE.Mesh(geo, mat);
                
                enemy.position.set((Math.random() - 0.5) * 40, 1, Math.random() * 200 - 100);
                scene.add(enemy);
                enemies.push(enemy);
            }
        }

        // Game Loop & Logic
        function animate() {
            requestAnimationFrame(animate);

            // Camera Tracking
            if (player) {
                camera.position.x = player.position.x;
                camera.position.y = player.position.y + 3;
                camera.position.z = player.position.z + 7;
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 5);
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('modal').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initScene;
    </script>
</body>
</html>
